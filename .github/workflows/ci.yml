name: CI Quality & Safety Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    name: Backend Lint & Tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, sqlite3
          coverage: none

      - name: Install Backend Dependencies
        run: |
          cd backend
          composer install --no-interaction --prefer-dist

      - name: Copy Env File
        run: |
          cd backend
          cp .env.example .env
          php artisan key:generate

      - name: Run Backend Linter (Pint)
        run: |
          cd backend
          ./vendor/bin/pint --test

      - name: Run Backend Tests
        run: |
          cd backend
          php artisan test

  frontend-quality:
    runs-on: ubuntu-latest
    name: Frontend Lint & Build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Linter (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Verify Frontend Production Build
        run: |
          cd frontend
          npm run build
